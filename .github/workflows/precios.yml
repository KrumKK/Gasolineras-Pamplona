name: Actualizar precios

on:
  schedule:
    # Comprueba los precios del Ministerio dos veces por hora (a y 7 y a y 37), día y noche.
    # GitHub no garantiza las ejecuciones programadas y a veces se salta alguna;
    # con dos por hora, al menos una cada hora es lo normal.
    # Guarda siempre data/estado.json (hora de la comprobación) y los precios solo si cambian.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios del Ministerio
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            if git diff --cached --quiet -- data/precios.json; then
              git commit -m "Comprobado $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M') (sin cambios de precio)"
            else
              git commit -m "Precios $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            fi
            # Si mientras tanto se ha subido otro cambio, se integra antes de enviar
            git pull --rebase --autostash || true
            git push
          fi
