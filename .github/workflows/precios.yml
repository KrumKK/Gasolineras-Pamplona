name: Actualizar precios

on:
  schedule:
    # Cada 2 horas de 6:17 a 22:17 (hora de Madrid en invierno). GitHub retrasa o salta a veces
    # las ejecuciones programadas; con varias al día los precios nunca se quedan atrasados.
    - cron: "17 5-21/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios del Ministerio
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            git push
          fi
