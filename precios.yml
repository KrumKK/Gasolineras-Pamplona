name: Actualizar precios

on:
  schedule:
    # Comprueba los precios del Ministerio cada hora (a y 17), día y noche.
    # Solo guarda (y la web se actualiza) cuando alguna gasolinera ha cambiado de precio.
    # GitHub puede retrasar unos minutos las ejecuciones programadas.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar precios del Ministerio
        run: python scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Precios $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
            git push
          fi
